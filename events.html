<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programmation — SCFPA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5A800;--orange:#D4520A;--dark:#0C0F0A;--card:#141910;--text:#F2F0E8;--muted:#8A9080;--green:#4A9E3F}*{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--text);font-family:Inter,sans-serif}nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(12,15,10,.94);border-bottom:1px solid rgba(245,168,0,.15);backdrop-filter:blur(15px)}nav img{height:46px}.back{color:var(--gold);font-weight:800;text-decoration:none}.languages{display:flex;gap:5px}.languages button{border:1px solid var(--muted);border-radius:30px;background:none;color:var(--muted);font-weight:800;padding:4px 10px}.languages button.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}header{text-align:center;padding:70px 20px 48px;background:radial-gradient(ellipse,rgba(45,106,46,.17),transparent 70%)}header small{color:var(--gold);font-weight:800;letter-spacing:3px;text-transform:uppercase}h1{font:clamp(3rem,8vw,5.5rem)/1 'Bebas Neue',sans-serif;margin:12px 0;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;color:transparent}header p{color:var(--muted)}main{max-width:1000px;margin:auto;padding:10px 22px 80px}.loading,.empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed rgba(255,255,255,.1);border-radius:14px}.month{margin:30px 0 42px}.month-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}.month-head h2{font:2rem 'Bebas Neue';color:var(--gold);text-transform:capitalize;margin:0}.month-head span{font-size:.72rem;color:var(--muted);font-weight:800}.line{height:1px;background:rgba(245,168,0,.16);flex:1}.event{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:16px 20px;margin:10px 0}.date{width:48px;text-align:center;flex:none}.day{font:2rem/1 'Bebas Neue';color:var(--gold)}.mon{font-size:.6rem;color:var(--muted);font-weight:800;text-transform:uppercase}.divider{width:1px;align-self:stretch;background:rgba(255,255,255,.08)}.copy{flex:1;min-width:0}.copy h3{font-size:.98rem;margin:0 0 4px;overflow-wrap:anywhere}.copy p{font-size:.82rem;color:var(--muted);margin:0;overflow-wrap:anywhere}.tag{font-size:.7rem;font-weight:800;color:var(--gold);background:rgba(245,168,0,.1);padding:4px 11px;border-radius:30px}.rsvp{border:1px solid rgba(245,168,0,.35);background:none;color:var(--gold);border-radius:30px;padding:9px 14px;font-weight:800;cursor:pointer}.modal{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(0,0,0,.84);padding:18px}.modal.open{display:flex}.dialog{width:min(500px,100%);background:#101b11;border:1px solid rgba(245,168,0,.25);border-radius:20px;padding:26px}.dialog h2{font:2rem 'Bebas Neue';color:var(--gold);margin:0}.capacity{color:var(--muted);font-size:.8rem;margin:5px 0 18px}.field{display:block;margin:12px 0}.field span{display:block;color:var(--muted);font-size:.75rem;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:white}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{border:0;border-radius:30px;padding:10px 15px;font-weight:800}.cancel{background:rgba(255,255,255,.08);color:white}.confirm{background:var(--green);color:white}.success{display:none;color:#7bd47f;background:rgba(76,175,80,.12);padding:12px;border-radius:10px}.footer{text-align:center;margin-top:45px}@media(max-width:700px){nav{padding:12px 14px}.event{align-items:flex-start;flex-wrap:wrap;padding:14px}.copy{min-width:calc(100% - 82px)}.tag{margin-left:64px}.rsvp{margin-left:auto}}
</style>
</head>
<body>
<nav><a class="back" href="index.html">← <span data-fr="Retour" data-en="Back">Retour</span></a><img src="scfpa-logo.png" alt="SCFPA"><div class="languages"><button class="active" onclick="setLang('fr')">FR</button><button onclick="setLang('en')">EN</button></div></nav>
<header><small>SCFPA</small><h1 data-fr="Programmation" data-en="Programming">Programmation</h1><p data-fr="Tous les événements publiés par la SCFPA." data-en="All events published by SCFPA.">Tous les événements publiés par la SCFPA.</p></header>
<main><div id="events" class="loading">Chargement de la programmation…</div><div class="footer"><a class="back" href="index.html">← <span data-fr="Retour au site" data-en="Back to site">Retour au site</span></a></div></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeRsvp()"><div class="dialog"><h2 data-fr="Inscription" data-en="Event RSVP">Inscription</h2><strong id="event-name"></strong><div id="capacity" class="capacity"></div><div id="success" class="success" data-fr="Merci! Votre inscription est confirmée." data-en="Thank you! Your RSVP is confirmed.">Merci! Votre inscription est confirmée.</div><form id="form"><input name="website" tabindex="-1" style="position:absolute;left:-9999px"><label class="field"><span data-fr="Nom complet" data-en="Full name">Nom complet</span><input name="name" required></label><label class="field"><span data-fr="Courriel" data-en="Email">Courriel</span><input name="email" type="email" required></label><label class="field"><span data-fr="Nombre de personnes" data-en="Number of attendees">Nombre de personnes</span><input name="party_size" type="number" min="1" max="60" value="1" required></label><div class="actions"><button type="button" class="cancel" onclick="closeRsvp()" data-fr="Annuler" data-en="Cancel">Annuler</button><button class="confirm" type="submit" data-fr="Confirmer" data-en="Confirm">Confirmer</button></div></form></div></div>
<script>
let lang='fr',allItems=[],activeKey='';const SITE='aa6c860a-b745-41f0-84cb-062804ff09a7',API='https://jamfam-client-hub.onrender.com/api/public/rsvp';
function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function keyFor(i){return [i.date,i.title_fr||i.title_en||'event'].join('-').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,180)}
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('.languages button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===l));document.querySelectorAll('[data-fr]').forEach(e=>e.textContent=e.dataset[l]||e.textContent);render()}
function render(){const root=document.getElementById('events'),locale=lang==='fr'?'fr-CA':'en-CA',items=allItems.filter(i=>i&&i._offline!==true&&/^\d{4}-\d{2}-\d{2}$/.test(i.date||'')).sort((a,b)=>a.date.localeCompare(b.date));if(!items.length){root.className='empty';root.textContent=lang==='fr'?'Aucun événement publié pour le moment.':'No events are published yet.';return}const groups=new Map();items.forEach(i=>{const k=i.date.slice(0,7);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)});root.className='';root.innerHTML=[...groups].map(([k,list])=>{const [y,m]=k.split('-').map(Number),base=new Date(Date.UTC(y,m-1,1)),month=new Intl.DateTimeFormat(locale,{month:'long',timeZone:'UTC'}).format(base);return `<section class="month"><div class="month-head"><h2>${esc(month)}</h2><span>${y}</span><div class="line"></div></div>${list.map(i=>{const d=new Date(i.date+'T00:00:00Z'),title=lang==='fr'?(i.title_fr||i.title_en):(i.title_en||i.title_fr),time=lang==='fr'?(i.time_fr||i.time_en):(i.time_en||i.time_fr),meta=[i.venue,i.address,time].filter(Boolean).join(' · '),enabled=String(i.registration_enabled||'yes').toLowerCase()!=='no';return `<article class="event"><div class="date"><div class="day">${d.getUTCDate()}</div><div class="mon">${esc(new Intl.DateTimeFormat(locale,{month:'short',timeZone:'UTC'}).format(d).replace('.',''))}</div></div><div class="divider"></div><div class="copy"><h3>${esc(title)}</h3>${meta?`<p>${esc(meta)}</p>`:''}</div>${i.status?`<span class="tag">${esc(i.status)}</span>`:''}${enabled?`<button class="rsvp" data-key="${esc(i.registration_key||keyFor(i))}" data-title="${esc(title)}" onclick="openRsvp(this)">${lang==='fr'?"S'inscrire":'RSVP'}</button>`:''}</article>`}).join('')}</section>`}).join('')}
document.addEventListener('jamfam:content-loaded',e=>{const f=(e.detail.fields||[]).find(x=>x.page_key==='events'&&x.field_key==='items');try{allItems=JSON.parse(f?.value||'[]')}catch{allItems=[]}render()});
async function openRsvp(b){activeKey=b.dataset.key;document.getElementById('event-name').textContent=b.dataset.title;document.getElementById('success').style.display='none';document.getElementById('form').style.display='block';document.getElementById('modal').classList.add('open');const c=document.getElementById('capacity');c.textContent=lang==='fr'?'Vérification des places…':'Checking spots…';try{const r=await fetch(`${API}/sites/${SITE}/events/${encodeURIComponent(activeKey)}`),d=await r.json();if(!r.ok)throw 0;c.textContent=lang==='fr'?`${d.remaining} places disponibles sur ${d.capacity}.`:`${d.remaining} of ${d.capacity} spots remaining.`;document.querySelector('[name=party_size]').max=Math.max(1,d.remaining)}catch{c.textContent=lang==='fr'?'Disponibilité confirmée lors de l’inscription.':'Availability confirmed when registering.'}}
function closeRsvp(){document.getElementById('modal').classList.remove('open')}
document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();const f=new FormData(this),b=this.querySelector('[type=submit]');b.disabled=true;try{const r=await fetch(`${API}/sites/${SITE}/events/${encodeURIComponent(activeKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),email:f.get('email'),partySize:Number(f.get('party_size')),website:f.get('website')})}),d=await r.json();if(!r.ok){const x=new Error();x.code=d.code;throw x}this.style.display='none';document.getElementById('success').style.display='block';this.reset()}catch(x){alert(x.code==='EVENT_FULL'?(lang==='fr'?'Il ne reste pas assez de places.':'Not enough spots remain.'):x.code==='ALREADY_REGISTERED'?(lang==='fr'?'Ce courriel est déjà inscrit.':'This email is already registered.'):(lang==='fr'?"L'inscription a échoué.":'Registration failed.'))}finally{b.disabled=false}});
</script>
<script src="https://jamfam-client-hub.onrender.com/jamfam-content.js" data-site-id="aa6c860a-b745-41f0-84cb-062804ff09a7" defer></script>
</body></html>
